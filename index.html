<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Registro P2P">
    <meta name="theme-color" content="#EEF1F5">
    <title>Registro P2P</title>
    <link rel="icon" type="image/png" href="https://i.imgur.com/fK4ZCLV.png">
    <link rel="apple-touch-icon" href="https://i.imgur.com/fK4ZCLV.png">
    <link rel="manifest" href="data:application/json;base64,eyJuYW1lIjoiUmVnaXN0cm8gUDJQIiwic2hvcnRfbmFtZSI6IlAyUCIsInN0YXJ0X3VybCI6Ii4iLCJkaXNwbGF5Ijoic3RhbmRhbG9uZSIsImJhY2tncm91bmRfY29sb3IiOiIjRUVGMUY1IiwidGhlbWVfY29sb3IiOiIjRUVGMUY1IiwiaWNvbnMiOlt7InNyYyI6Imh0dHBzOi8vaS5pbWd1ci5jb20vZks0WkNMVi5wbmciLCJzaXplcyI6IjUxMng1MTIiLCJ0eXBlIjoiaW1hZ2UvcG5nIiwicHVycG9zZSI6ImFueSBtYXNrYWJsZSJ9XX0=">
    <!-- Archivo: letra de ancho variable. Los números van angostos para que
         entren grandes en el teléfono. Si no carga, se usa la del sistema. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap"></noscript>
    <link rel="stylesheet" href="src/css/00-tokens.css?v=8.0.0">
    <link rel="stylesheet" href="src/css/01-base.css?v=8.0.0">
    <link rel="stylesheet" href="src/css/02-components.css?v=8.0.0">
    <link rel="stylesheet" href="src/css/03-pantallas.css?v=8.0.0">
</head>
<body>
    <!-- Mientras carga: la forma del inicio, para que la espera se sienta corta -->
    <div class="cargando" id="loadingOverlay" role="status" aria-label="Cargando">
        <div class="esq-col">
            <div class="esq" style="width:52%;height:18px"></div>
            <div class="esq" style="width:30%;height:13px"></div>
            <div class="esq" style="width:34%;height:15px;margin-top:22px"></div>
            <div class="esq" style="width:64%;height:62px"></div>
            <div class="esq" style="width:100%;height:84px;margin-top:14px"></div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px"><div class="esq" style="height:58px"></div><div class="esq" style="height:58px"></div></div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px"><div class="esq" style="height:96px"></div><div class="esq" style="height:96px"></div></div>
        </div>
    </div>

    <!-- ═══ Entrada ═══ -->
    <main class="acceso hidden" id="authContainer">
        <h1 class="acceso-marca">Registro P2P</h1>
        <p class="acceso-sub">Tus compras y ventas de USDT, con cada peso en su lugar.</p>
        <div class="segmento" role="tablist" aria-label="Entrar o crear cuenta">
            <button type="button" role="tab" id="tabLogin" aria-selected="true">Entrar</button>
            <button type="button" role="tab" id="tabRegister" aria-selected="false">Crear cuenta</button>
        </div>
        <div class="auth-error" id="authError" role="alert"></div>
        <form id="loginForm" novalidate>
            <div><label class="rotulo" for="loginUser">Usuario</label><input class="campo" type="text" id="loginUser" autocomplete="username" autocapitalize="none" spellcheck="false" required></div>
            <div><label class="rotulo" for="loginPass">Contraseña</label><input class="campo" type="password" id="loginPass" autocomplete="current-password" required></div>
            <button type="submit" class="btn" id="loginBtn">Entrar</button>
        </form>
        <form id="registerForm" class="hidden" novalidate>
            <div><label class="rotulo" for="regUser">Usuario</label><input class="campo" type="text" id="regUser" autocomplete="username" autocapitalize="none" spellcheck="false" required><small>Letras, números y guiones, de 3 a 20.</small></div>
            <div><label class="rotulo" for="regPass">Contraseña</label><input class="campo" type="password" id="regPass" autocomplete="new-password" required><small>Por lo menos 6 caracteres.</small></div>
            <div><label class="rotulo" for="regPassConfirm">Repetí la contraseña</label><input class="campo" type="password" id="regPassConfirm" autocomplete="new-password" required></div>
            <button type="submit" class="btn" id="registerBtn">Crear cuenta</button>
        </form>
    </main>

    <!-- ═══ App ═══ -->
    <div class="app" id="appContainer">
        <section class="tab-pantalla" id="pInicio" aria-label="Inicio">
            <header class="inicio-cab">
                <div>
                    <div class="inicio-fecha" id="inicioFecha"></div>
                    <button type="button" class="sync offline" id="syncStatus" data-a="sync"><span id="syncText">Conectando…</span><span class="n" id="syncBadge" style="display:none"></span></button>
                </div>
                <button type="button" class="campana" id="newsBellBtn" data-a="novedades" aria-label="Novedades">
                    <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 01-3.4 0"/></svg>
                    <span class="punto-rojo hidden" id="newsBellBadge"></span>
                </button>
            </header>
            <div id="inicioCuerpo"></div>
        </section>

        <section class="tab-pantalla" id="pRegistro" aria-label="Registro" hidden>
            <header class="cab-tab">
                <h1 class="titulo-tab">Registro</h1>
                <button type="button" class="campana" id="regBuscarBtn" data-a="reg-buscar" aria-label="Buscar" aria-expanded="false">
                    <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M11 18a7 7 0 100-14 7 7 0 000 14zM20 20l-4-4"/></svg>
                </button>
            </header>
            <div class="buscar-fila hidden" id="regBuscarFila">
                <input class="campo" id="regBuscar" type="search" data-in="reg-buscar" placeholder="Categoría, nota, cuenta o monto" enterkeyhint="search" autocomplete="off" aria-label="Buscar en el registro">
            </div>
            <div class="filtros" id="registroFiltros"></div>
            <div id="registroCuerpo"></div>
        </section>

        <section class="tab-pantalla" id="pCuentas" aria-label="Cuentas" hidden>
            <header class="cab-tab"><h1 class="titulo-tab">Cuentas</h1></header>
            <div id="cuentasCuerpo"></div>
        </section>

        <section class="tab-pantalla" id="pMas" aria-label="Más" hidden>
            <header class="cab-tab"><h1 class="titulo-tab">Más</h1></header>
            <div id="masCuerpo"></div>
        </section>

        <nav class="tabs" aria-label="Secciones">
            <button type="button" class="tab" data-a="tab" data-tab="inicio" aria-current="page">
                <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/></svg><span>Inicio</span>
            </button>
            <button type="button" class="tab" data-a="tab" data-tab="registro">
                <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6M9 16h4"/></svg><span>Registro</span>
            </button>
            <button type="button" class="tab-mas" data-a="cargar" aria-label="Cargar un movimiento">
                <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            </button>
            <button type="button" class="tab" data-a="tab" data-tab="cuentas">
                <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10h18M4 10V9l8-5 8 5v1M6 10v7M10 10v7M14 10v7M18 10v7M3 20h18"/></svg><span>Cuentas</span>
            </button>
            <button type="button" class="tab" data-a="tab" data-tab="mas">
                <svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/></svg><span>Más</span>
            </button>
        </nav>
    </div>

    <!-- Hojas, vistas y diálogos se agregan acá -->
    <div id="capas"></div>
    <div class="aviso" id="aviso" role="status" aria-live="polite"></div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script src="src/js/01-config.js?v=8.0.0"></script>
    <script src="src/js/02-state.js?v=8.0.0"></script>
    <script src="src/js/03-news-changelog.js?v=8.0.0"></script>
    <script src="src/js/04-utils-filtros.js?v=8.0.0"></script>
    <script src="src/js/05-integridad.js?v=8.0.0"></script>
    <script src="src/js/06-paginacion-bancos-fifo.js?v=8.0.0"></script>
    <script src="src/js/07-firebase-sync.js?v=8.0.0"></script>
    <script src="src/js/08-backup-recovery-sdk.js?v=8.0.0"></script>
    <script src="src/js/09-form-split.js?v=8.0.0"></script>
    <script src="src/js/10-mov-transf-calendario.js?v=8.0.0"></script>
    <script src="src/js/12-lotes-reset-importexport.js?v=8.0.0"></script>
    <script src="src/js/13-eventos.js?v=8.0.0"></script>
    <script src="src/js/14-recovery-write.js?v=8.0.0"></script>
    <script src="src/js/15-archivo.js?v=8.0.0"></script>
    <script src="src/js/16-store-v2.js?v=8.0.0"></script>
    <script src="src/js/17-registros.js?v=8.0.0"></script>
    <script src="src/js/18-ui-base.js?v=8.0.0"></script>
    <script src="src/js/19-ui-inicio.js?v=8.0.0"></script>
    <script src="src/js/20-ui-registro.js?v=8.0.0"></script>
    <script src="src/js/21-ui-cargar.js?v=8.0.0"></script>
    <script src="src/js/22-ui-cuentas.js?v=8.0.0"></script>
    <script src="src/js/23-ui-herramientas.js?v=8.0.0"></script>
</body>
</html>
