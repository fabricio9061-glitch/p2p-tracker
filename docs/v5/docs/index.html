<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="P2P Tracker v5" />
  <title>P2P Tracker v5</title>
  <link rel="stylesheet" href="./css/app.css" />
</head>
<body>
  <div id="authView" class="auth-shell">
    <div class="auth-card">
      <h1>P2P Tracker</h1>
      <p>v5 modular · subcollections</p>
      <input id="authEmail" type="email" placeholder="Email" autocomplete="email" />
      <input id="authPassword" type="password" placeholder="Contraseña" autocomplete="current-password" />
      <button id="btnLogin">Entrar</button>
      <button id="btnRegister" class="secondary">Crear cuenta</button>
      <div id="authMsg" class="msg"></div>
    </div>
  </div>

  <div id="appView" class="app hidden">
    <header class="topbar">
      <div>
        <h1>Registro P2P</h1>
        <span id="syncStatus" class="status">Iniciando…</span>
      </div>
      <button id="btnLogout" class="secondary small">Salir</button>
    </header>

    <main class="layout">
      <section class="card hero">
        <div>
          <span class="label">Saldo USDT</span>
          <strong id="saldoUsdt">0.00</strong>
        </div>
        <div>
          <span class="label">Ganancia total</span>
          <strong id="gananciaTotal">$0</strong>
        </div>
      </section>

      <section class="card form-card">
        <h2>Nueva operación</h2>
        <form id="opForm">
          <div class="grid2">
            <select id="opTipo"><option value="compra">Compra</option><option value="venta">Venta</option></select>
            <select id="opMoneda"><option value="UYU">UYU</option><option value="USD">USD</option></select>
          </div>
          <div class="grid2">
            <input id="opBanco" placeholder="Banco" value="Itau" />
            <input id="opFecha" type="date" />
          </div>
          <div class="grid3">
            <input id="opMonto" type="number" step="0.01" placeholder="Monto" />
            <input id="opTasa" type="number" step="0.001" placeholder="Tasa" />
            <input id="opComision" type="number" step="0.01" placeholder="Comisión %" value="0.14" />
          </div>
          <button type="submit">Guardar operación</button>
        </form>
      </section>

      <section class="card tools">
        <h2>Backup</h2>
        <button id="btnExport" class="secondary">Exportar JSON</button>
        <label class="file-btn">Importar JSON<input id="fileImport" type="file" accept="application/json" hidden></label>
        <p class="hint">Import reemplaza server completo solo con confirmación.</p>
      </section>

      <section class="card list-card">
        <div class="section-head"><h2>Operaciones</h2><span id="opsCount">0</span></div>
        <div id="opsList" class="list"></div>
      </section>
    </main>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
